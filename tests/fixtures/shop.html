<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Trail running shoes | Demo Shop</title>
    <style>
      body { margin: 0; font: 16px system-ui, sans-serif; color: #17231f; }
      header, main { max-width: 960px; margin: auto; padding: 24px; }
      .layout { display: grid; grid-template-columns: 250px 1fr; gap: 32px; }
      fieldset { margin: 0 0 16px; padding: 14px; border: 1px solid #ccd8d2; }
      label { display: block; margin: 8px 0; }
      .products { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .product { min-height: 120px; padding: 16px; background: #eef4f1; }
    </style>
  </head>
  <body>
    <header><h1>Trail running shoes</h1></header>
    <main class="layout">
      <aside aria-label="Product filters">
        <fieldset>
          <legend>Brand</legend>
          <label><input id="brand-nike" type="checkbox" name="brand" value="nike"> Nike</label>
          <label><input type="checkbox" name="brand" value="adidas"> Adidas</label>
        </fieldset>
        <fieldset>
          <legend>Size</legend>
          <label for="size">Shoe size</label>
          <select id="size" name="size">
            <option value="40">EU 40</option>
            <option value="42">EU 42</option>
          </select>
        </fieldset>
        <fieldset role="group" aria-label="Color">
          <button id="color-black" type="button" role="checkbox" aria-label="Black" aria-checked="false">Black</button>
        </fieldset>
        <fieldset>
          <legend>Price</legend>
          <label for="min-price">Minimum price</label>
          <input id="min-price" type="number" name="min_price" value="50" min="0">
        </fieldset>
        <fieldset>
          <legend>Terrain intensity</legend>
          <label for="terrain">Terrain intensity</label>
          <input id="terrain" type="range" min="0" max="10">
        </fieldset>
      </aside>
      <section class="products" aria-label="Products">
        <a class="product" href="/product/1">Trail shoe one</a>
        <a class="product" href="/product/2">Trail shoe two</a>
        <a class="product" href="/product/3">Trail shoe three</a>
        <a class="product" href="/product/4">Trail shoe four</a>
      </section>
    </main>
    <script>
      const params = new URL(location.href).searchParams;
      const preset = params.get("preset") === "1";
      document.querySelector("#brand-nike").checked = params.getAll("brand").includes("nike") || preset;
      document.querySelector("#size").value = preset ? "42" : "40";
      document.querySelector("#min-price").value = preset ? "50" : "";
      const color = document.querySelector("#color-black");
      color.setAttribute("aria-checked", String(preset));
      color.addEventListener("click", () => color.setAttribute("aria-checked", String(color.getAttribute("aria-checked") !== "true")));
    </script>
  </body>
</html>
