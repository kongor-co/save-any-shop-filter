name: Live storefront acceptance

on:
  workflow_dispatch:
    inputs:
      shop:
        description: Storefront scenario
        required: true
        default: all
        type: choice
        options:
          - all
          - idealo-de
          - decathlon-de
          - mediamarkt-de
          - cyberport-de

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run explicit live acceptance
        env:
          FILTERVAULT_ACCEPTANCE_SHOP: ${{ inputs.shop }}
        run: npm run test:live -- --shop "$FILTERVAULT_ACCEPTANCE_SHOP"
      - name: Keep reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-acceptance
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            .live-acceptance/*/report.json
            .live-acceptance/*/report.md
            .live-acceptance/*/*.png
